<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Neural IA — laboratório neural online</title>
  <desc id="desc">Painel do projeto Neural IA com treinamento no navegador, visualização de rede e convite para contribuir.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#061522"/>
      <stop offset=".52" stop-color="#040b14"/>
      <stop offset="1" stop-color="#09091b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#45ebfb"/>
      <stop offset=".52" stop-color="#69b3ff"/>
      <stop offset="1" stop-color="#a87bff"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#12466c"/>
      <stop offset=".52" stop-color="#2b4381"/>
      <stop offset="1" stop-color="#65438c"/>
    </linearGradient>
    <radialGradient id="core">
      <stop stop-color="#f4ffff"/>
      <stop offset=".18" stop-color="#45ebfb"/>
      <stop offset=".55" stop-color="#6387ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#a87bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#20445d" stroke-width=".6" opacity=".25"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="visualClip"><rect x="725" y="67" width="425" height="326" rx="16"/></clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="438" rx="18" fill="url(#background)" stroke="#185473"/>
  <rect x="1" y="1" width="1198" height="438" rx="18" fill="url(#grid)"/>
  <path d="M19 1H1181" stroke="url(#accent)" stroke-width="2.5"/>

  <g font-family="Consolas,ui-monospace,monospace">
    <circle cx="29" cy="29" r="5" fill="#45ebfb" filter="url(#glow)"/>
    <text x="47" y="34" fill="#45ebfb" font-size="14" font-weight="700" letter-spacing="1.6">PROJETO EM DESTAQUE // FEATURED LAB</text>
    <text x="1167" y="34" text-anchor="end" fill="#55f0ad" font-size="11" font-weight="700">● ONLINE 24/7</text>
  </g>

  <g transform="translate(48 75)">
    <g transform="translate(0 2)">
      <rect width="47" height="47" rx="12" fill="#071521" stroke="#2c657f"/>
      <path d="M13 34V14l11 20V14l11 20V14" fill="none" stroke="url(#accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#eaffff">
        <circle cx="13" cy="14" r="2.2"/><circle cx="13" cy="34" r="2.2"/>
        <circle cx="24" cy="14" r="2.2"/><circle cx="24" cy="34" r="2.2"/>
        <circle cx="35" cy="14" r="2.2"/><circle cx="35" cy="34" r="2.2"/>
      </g>
    </g>
    <text x="63" y="22" fill="#f1f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="750">NEURAL IA</text>
    <text x="63" y="43" fill="#65d8f4" font-family="Consolas,monospace" font-size="10" letter-spacing="1.4">OPEN NEURAL SYSTEM · V2.0</text>

    <text x="0" y="103" fill="#f3f8ff" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="760">LABORATÓRIO NEURAL</text>
    <text x="0" y="145" fill="url(#accent)" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="760">VIVO NO NAVEGADOR.</text>
    <text x="0" y="179" fill="#a6bad0" font-family="Segoe UI,Arial,sans-serif" font-size="15">Treine uma rede real, acompanhe a perda, explore a</text>
    <text x="0" y="202" fill="#a6bad0" font-family="Segoe UI,Arial,sans-serif" font-size="15">fronteira de decisão e exporte os pesos — sem instalar nada.</text>

    <g transform="translate(0 230)" font-family="Consolas,monospace">
      <g>
        <rect width="174" height="51" rx="9" fill="#071521" stroke="#1c465f"/>
        <text x="14" y="19" fill="#668198" font-size="8" letter-spacing="1.2">EXECUÇÃO</text>
        <text x="14" y="38" fill="#45ebfb" font-size="12" font-weight="700">100% NO BROWSER</text>
      </g>
      <g transform="translate(185)">
        <rect width="151" height="51" rx="9" fill="#071521" stroke="#1c465f"/>
        <text x="14" y="19" fill="#668198" font-size="8" letter-spacing="1.2">DATASETS</text>
        <text x="14" y="38" fill="#a88bff" font-size="12" font-weight="700">5 EXPERIMENTOS</text>
      </g>
      <g transform="translate(347)">
        <rect width="146" height="51" rx="9" fill="#071521" stroke="#1c465f"/>
        <text x="14" y="19" fill="#668198" font-size="8" letter-spacing="1.2">PRIVACIDADE</text>
        <text x="14" y="38" fill="#55f0ad" font-size="12" font-weight="700">ZERO BACKEND</text>
      </g>
    </g>

    <g transform="translate(0 298)">
      <rect width="310" height="49" rx="9" fill="url(#accent)"/>
      <text x="155" y="30" text-anchor="middle" fill="#03121b" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="750">ABRIR LABORATÓRIO  ↗</text>
      <text x="329" y="29" fill="#87a1b8" font-family="Consolas,monospace" font-size="10">FORKS E PULL REQUESTS ABERTOS</text>
    </g>
  </g>

  <g clip-path="url(#visualClip)">
    <rect x="725" y="67" width="425" height="326" rx="16" fill="#050d17"/>
    <rect x="725" y="67" width="425" height="326" fill="url(#grid)" opacity=".7"/>
    <path d="M725 303C807 201 884 347 963 224s124-53 187-102V393H725Z" fill="url(#surface)" opacity=".48"/>
    <path d="M725 318C815 194 891 359 973 232s126-61 177-102" fill="none" stroke="#7aa9ff" stroke-width="1.2" opacity=".75"/>

    <g stroke-linecap="round">
      <g stroke="#45ebfb" opacity=".55">
        <path d="M768 153L866 109M768 153L866 174M768 153L866 239M768 297L866 109M768 297L866 174M768 297L866 239"/>
      </g>
      <g stroke="#a87bff" opacity=".6">
        <path d="M866 109L1004 221M866 174L1004 221M866 239L1004 221" stroke-width="1.4"/>
      </g>
      <path d="M1004 221L1105 149M1004 221L1105 300" stroke="#65c9ff" opacity=".5"/>
    </g>

    <g filter="url(#glow)">
      <g fill="#45ebfb" stroke="#dfffff"><circle cx="768" cy="153" r="8"/><circle cx="768" cy="297" r="8"/></g>
      <g fill="#a87bff" stroke="#f0e7ff"><circle cx="866" cy="109" r="7"/><circle cx="866" cy="174" r="7"/><circle cx="866" cy="239" r="7"/></g>
      <circle cx="1004" cy="221" r="38" fill="url(#core)"/>
      <circle cx="1004" cy="221" r="8" fill="#f3ffff"/>
      <g fill="#65d7ff" stroke="#e9ffff"><circle cx="1105" cy="149" r="6"/><circle cx="1105" cy="300" r="6"/></g>
    </g>

    <g font-family="Consolas,monospace" font-size="9" letter-spacing="1.2">
      <text x="747" y="92" fill="#668198">LIVE ARCHITECTURE</text>
      <text x="1128" y="92" text-anchor="end" fill="#45ebfb">2 → N → 1</text>
      <text x="756" y="372" fill="#7991a8">ENTRADA</text>
      <text x="845" y="372" fill="#7991a8">OCULTA</text>
      <text x="985" y="372" fill="#7991a8">DECISÃO</text>
    </g>
  </g>
  <rect x="725" y="67" width="425" height="326" rx="16" fill="none" stroke="#23607f"/>
</svg>
