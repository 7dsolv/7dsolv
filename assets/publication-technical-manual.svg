<svg xmlns="http://www.w3.org/2000/svg" width="560" height="350" viewBox="0 0 560 350" role="img" aria-labelledby="title desc">
  <title id="title">Konaet OS — Manual técnico integral</title>
  <desc id="desc">Prévia visual do manual técnico completo do Konaet OS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071522"/><stop offset="1" stop-color="#030914"/></linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141738"/><stop offset=".5" stop-color="#40318e"/><stop offset="1" stop-color="#087fa1"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#9b72ff"/><stop offset="1" stop-color="#20e3ff"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="558" height="348" rx="13" fill="url(#bg)" stroke="#5749a0"/>
  <path d="M14 1H546" stroke="url(#accent)" stroke-width="2"/>
  <text x="22" y="30" fill="#b99cff" font-family="Consolas,monospace" font-size="12" letter-spacing="1.2">PUBLICAÇÃO // TECHNICAL MANUAL</text>

  <g transform="translate(23 49)">
    <rect width="206" height="275" rx="9" fill="url(#cover)" stroke="#b5a1ff"/>
    <circle cx="181" cy="81" r="80" fill="none" stroke="#fff" opacity=".08" stroke-width="18"/>
    <circle cx="181" cy="81" r="49" fill="none" stroke="#fff" opacity=".14"/>
    <text x="18" y="31" fill="#65f5ff" font-family="Consolas,monospace" font-size="8" font-weight="700" letter-spacing="1.3">KONAET ENGINEERING DOSSIER</text>
    <text x="18" y="73" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800">Manual técnico</text>
    <text x="18" y="103" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="800">integral</text>
    <text x="18" y="137" fill="#e0dcff" font-family="Segoe UI,Arial,sans-serif" font-size="10">Arquitetura, subsistemas,</text>
    <text x="18" y="153" fill="#e0dcff" font-family="Segoe UI,Arial,sans-serif" font-size="10">evidências, limites e roadmap.</text>
    <rect x="18" y="211" width="151" height="25" rx="12" fill="#0b102b" opacity=".68" stroke="#b9a5ff"/>
    <text x="93" y="227" text-anchor="middle" fill="#fff" font-family="Consolas,monospace" font-size="8" font-weight="700">MEMORY SERVICES I</text>
    <text x="18" y="260" fill="#e9e5ff" font-family="Consolas,monospace" font-size="8">x86-64 · DOSSIÊ COMPLETO</text>
  </g>

  <g transform="translate(250 50)">
    <text x="0" y="18" fill="#edf7ff" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Documento de referência</text>
    <path d="M0 33H276" stroke="#3a3970"/>
    <g font-family="Segoe UI,Arial,sans-serif" font-size="12">
      <circle cx="8" cy="60" r="4" fill="#9b72ff"/><text x="22" y="64" fill="#d6d5ec">Arquitetura completa do artefato</text>
      <circle cx="8" cy="91" r="4" fill="#9b72ff"/><text x="22" y="95" fill="#d6d5ec">Matriz de estado comprovado</text>
      <circle cx="8" cy="122" r="4" fill="#9b72ff"/><text x="22" y="126" fill="#d6d5ec">Processos, Ring 3, syscall e IPC</text>
      <circle cx="8" cy="153" r="4" fill="#9b72ff"/><text x="22" y="157" fill="#d6d5ec">Segurança e modelo de ameaça</text>
      <circle cx="8" cy="184" r="4" fill="#9b72ff"/><text x="22" y="188" fill="#d6d5ec">Roadmap verificável até uso geral</text>
    </g>
    <rect x="0" y="214" width="276" height="47" rx="7" fill="#141430" stroke="#514995"/>
    <text x="15" y="233" fill="#bda7ff" font-family="Consolas,monospace" font-size="9">CONTEÚDO</text>
    <text x="15" y="251" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="12">Manual integral · evidências reais</text>
    <rect x="0" y="274" width="276" height="38" rx="7" fill="url(#accent)"/>
    <text x="138" y="298" text-anchor="middle" fill="#07111f" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="800">CLIQUE PARA LER  →</text>
  </g>
</svg>
