    <text x="24" y="34" fill="#78c9ff" font-family="Consolas,monospace" font-size="13" letter-spacing="1.2">PROJETOS VISÍVEIS NO ECOSSISTEMA</text>
    <text x="724" y="34" text-anchor="end" fill="#6685a3" font-family="Consolas,monospace" font-size="10">STATUS // ACTIVE</text>

    <g transform="translate(22 55)">
