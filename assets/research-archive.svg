      <rect x="0" y="0" width="5" height="91" rx="2" fill="#20e3ff"/>
      <circle cx="34" cy="30" r="14" fill="none" stroke="#20e3ff" stroke-width="2"/><path d="M27 30h14M34 23v14" stroke="#20e3ff"/>
      <text x="58" y="27" fill="#ecf7ff" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">KONAET OS</text>
      <text x="58" y="48" fill="#78a5c7" font-family="Consolas,monospace" font-size="11">KERNEL · UEFI · RING 3 · IPC</text>
      <text x="22" y="75" fill="#20f6a7" font-family="Consolas,monospace" font-size="10">● SISTEMA OPERACIONAL EM DESENVOLVIMENTO</text>
    </g>

    <g transform="translate(384 55)">
      <rect width="342" height="91" rx="9" fill="#081725" stroke="#4f43a5"/>
      <rect x="0" y="0" width="5" height="91" rx="2" fill="#9b72ff"/>
      <circle cx="34" cy="30" r="14" fill="none" stroke="#9b72ff" stroke-width="2"/><path d="M26 34q8-20 16 0M27 27h14" fill="none" stroke="#9b72ff"/>
      <text x="58" y="27" fill="#ecf7ff" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">AGIMATHEMATIC</text>
      <text x="58" y="48" fill="#78a5c7" font-family="Consolas,monospace" font-size="11">IA · MATEMÁTICA · MODELOS</text>
      <text x="22" y="75" fill="#c39cff" font-family="Consolas,monospace" font-size="10">● PESQUISA COMPUTACIONAL ATIVA</text>
    </g>

    <g transform="translate(22 160)">
      <rect width="342" height="91" rx="9" fill="#081725" stroke="#17628a"/>
      <rect x="0" y="0" width="5" height="91" rx="2" fill="#448cff"/>
      <circle cx="34" cy="30" r="14" fill="none" stroke="#448cff" stroke-width="2"/><circle cx="30" cy="27" r="3" fill="#448cff"/><circle cx="39" cy="34" r="3" fill="#448cff"/><path d="M30 27L39 34" stroke="#448cff"/>
      <text x="58" y="27" fill="#ecf7ff" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">IA NEURAL</text>
      <text x="58" y="48" fill="#78a5c7" font-family="Consolas,monospace" font-size="11">REDES · INTELIGÊNCIA LOCAL</text>
      <text x="22" y="75" fill="#68a8ff" font-family="Consolas,monospace" font-size="10">● EXPERIMENTOS E ARQUITETURAS</text>
    </g>

    <g transform="translate(384 160)">
      <rect width="342" height="91" rx="9" fill="#081725" stroke="#17806b"/>
      <rect x="0" y="0" width="5" height="91" rx="2" fill="#20f6a7"/>
      <circle cx="34" cy="30" r="14" fill="none" stroke="#20f6a7"/><ellipse cx="34" cy="30" rx="5" ry="14" fill="none" stroke="#20f6a7"/><path d="M20 30h28" stroke="#20f6a7"/>
      <text x="58" y="27" fill="#ecf7ff" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">REALIDADE QUÂNTICA</text>
      <text x="58" y="48" fill="#78a5c7" font-family="Consolas,monospace" font-size="11">FÍSICA · SIMULAÇÃO · TEORIA</text>
      <text x="22" y="75" fill="#20f6a7" font-family="Consolas,monospace" font-size="10">● PESQUISA E PROTÓTIPOS</text>
    </g>
